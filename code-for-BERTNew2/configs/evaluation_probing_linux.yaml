model_name_or_path: "../result/CoT-Bert"

# Use one of: mask1 / mask2 / cls / all
repr_type: "all"

# CoT template settings (required for mask1/mask2)
mask_embedding_sentence: true
mask_num: 2
mask_embedding_sentence_delta: false
mask_embedding_sentence_org_mlp: false
mask_embedding_sentence_autoprompt: false
mask_embedding_sentence_template: '*cls*_The_sentence_of_"*sent_0*"_means_*mask*_,_so_it_can_be_summarized_as_*mask*_._*sep+*'

# Probing uses fixed tasks; mode kept for consistency
mode: "test"

