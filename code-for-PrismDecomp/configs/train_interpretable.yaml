model_name_or_path: "/Users/lmf/Documents/local/code/pretrain_models/bert-base-uncased"
train_file: "../data/wiki1m_for_simcse.txt"
output_dir: "../result/PrismDecomp-Interpretable-BERT"
num_train_epochs: 1
per_device_train_batch_size: 64
gradient_accumulation_steps: 2
learning_rate: 1e-5
max_seq_length: 32
evaluation_strategy: steps
metric_for_best_model: stsb_spearman
load_best_model_at_end: true
save_steps: 125
overwrite_output_dir: true
do_train: true
fp16: false
preprocessing_num_workers: 4
use_mps_device: false
dataloader_drop_last: true
seed: 0

# PrismDecomp core
num_semantics: 7
temperature: 0.05
lambda2: 0.1
orthogonal_constraint: true
semantic_weights_learnable: true

remove_unused_columns: false

# Theme cache Stage2 (read-only)
lambda_sup: 1.0
lambda_theme: 0.5
theme_cache_path: "preprocessed/wiki_theme_cache.jsonl"
compress_dim: 8
compress_mode: mlp
compressor_hidden: 256
compressor_ckpt: "preprocessed/theme_compressor.pt"
sup_loss_type: cosine

# Global CoT / mask prompt
mask_embedding_sentence: true
mask_embedding_sentence_template: "The sentence of \"[X]\" means [MASK]."
