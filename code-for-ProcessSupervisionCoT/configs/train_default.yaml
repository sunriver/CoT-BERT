model_name_or_path: "/Users/lmf/Documents/local/code/pretrain_models/bert-base-uncased"
train_file: "../data/wiki1m_for_simcse.txt"
output_dir: "../result/ProcessSupervisionCoT-BERT"
num_train_epochs: 1
per_device_train_batch_size: 64
gradient_accumulation_steps: 2
learning_rate: 1e-5
max_seq_length: 32
evaluation_strategy: steps
metric_for_best_model: eval_stsb_spearman
load_best_model_at_end: true
eval_steps: 125

# 补充保存策略配置
save_strategy: steps       # 与评估策略保持一致（按步数保存）
save_steps: 125             # 每 125 步保存一次（与 eval_steps 相同，确保每次评估后都保存）
save_total_limit: 1        # 只保留最新的1个模型（即当前最佳模型）

overwrite_output_dir: true
do_train: true
fp16: false
preprocessing_num_workers: 10
use_mps_device: false
dataloader_drop_last: true
seed: 0

# ProcessSupervisionCoT specific arguments
temperature: 0.05
temp: 0.05

# Template configuration
mask_embedding_sentence: true
mask_num: 2
mask_embedding_sentence_template: '*cls*_The_sentence_:_"*sent_0*"_means_*mask*_,_so_it_can_be_summarized_as_*mask*_._*sep+*'
mask_embedding_sentence_different_template: '*cls*_The_sentence_:_"*sent_0*"_means_*mask*_,_so_it_can_be_summarized_as_*mask*_._*sep+*'
mask_embedding_sentence_negative_template: '*cls*_The_sentence_:_"*sent_0*"_does_not_mean_*mask*_,_so_it_cannot_be_summarized_as_*mask*_._*sep+*'

# Loss function weights
cross_template_weight: 0.5
process_supervision_weight: 0.1
enable_process_supervision: false  # 默认关闭，需要时开启

