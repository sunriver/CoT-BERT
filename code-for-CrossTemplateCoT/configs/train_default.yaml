model_name_or_path: "/Users/lmf/Documents/local/code/pretrain_models/bert-base-uncased"
train_file: "../data/wiki1m_for_simcse.txt"
output_dir: "../result/CrossTemplateCoT-BERT"
num_train_epochs: 1
per_device_train_batch_size: 64
gradient_accumulation_steps: 2
learning_rate: 1e-5
max_seq_length: 32
evaluation_strategy: steps
metric_for_best_model: eval_stsb_spearman
load_best_model_at_end: true
eval_steps: 125

# 补充保存策略配置
save_strategy: steps
save_steps: 125
save_total_limit: 1

overwrite_output_dir: true
do_train: true
fp16: false
preprocessing_num_workers: 10
use_mps_device: false
dataloader_drop_last: true
seed: 0

# CrossTemplateCoT specific arguments
temperature: 0.05
temp: 0.05

# Template configuration
mask_embedding_sentence: true
mask_num: 2
mask_embedding_sentence_template: '*cls*_The_sentence_of_"*sent_0*"_means_*mask*_,_so_it_can_be_summarized_as_*mask*_._*sep+*'
mask_embedding_sentence_different_template: '*cls*_The_sentence_:_"*sent_0*"_means_*mask*_,_so_it_can_be_summarized_as_*mask*_._*sep+*'
mask_embedding_sentence_negative_template: '*cls*_The_sentence_:_"*sent_0*"_does_not_mean_*mask*_,_so_it_cannot_be_summarized_as_*mask*_._*sep+*'

# Loss weights (currently equal weights)
process_supervision_weight_1: 1.0
process_supervision_weight_2: 1.0
constraint_weight: 1.0

# Denoising settings
mask_embedding_sentence_delta: true
mask_embedding_sentence_delta_freeze: false
mask_embedding_sentence_org_mlp: false

